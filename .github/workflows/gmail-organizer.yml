name: Gmail Organizer

on:
  schedule:
    # Runs every day at 8:00 AM Argentina time (UTC-3) = 11:00 UTC
    - cron: "0 11 * * *"
  workflow_dispatch:  # Allow manual trigger from GitHub UI

jobs:
  organize:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write config.json from secret
        env:
          GMAIL_ORGANIZER_CONFIG_JSON: ${{ secrets.GMAIL_ORGANIZER_CONFIG_JSON }}
        run: echo "$GMAIL_ORGANIZER_CONFIG_JSON" > config.json

      - name: Run Gmail Organizer
        id: organizer
        env:
          GMAIL_TOKEN_JSON: ${{ secrets.GMAIL_TOKEN_JSON }}
        run: python gmail_organizer.py

      # TEMP DEBUG: force-test the GH_PAT / gh secret set path regardless of
      # whether the token actually needed a refresh, to confirm the fix.
      - name: DEBUG - test gh secret set with GH_PAT
        env:
          MY_GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          echo "--- token length as seen in this step ---"
          echo -n "$MY_GH_PAT" | wc -c
          echo "--- token first/last 6 chars ---"
          echo "${MY_GH_PAT:0:6}...${MY_GH_PAT: -6}"
          echo "--- curl directly, bypassing gh entirely ---"
          curl -s -H "Authorization: Bearer $MY_GH_PAT" -H "Accept: application/vnd.github+json" https://api.github.com/user
          echo ""
          echo "--- now via gh with GH_TOKEN set inline ---"
          GH_TOKEN="$MY_GH_PAT" gh api user --jq .login || true

      # If the OAuth token was refreshed during the run, update the secret
      # so it doesn't expire on the next run.
      - name: Update token secret if refreshed
        if: steps.organizer.outputs.updated_token != ''
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          UPDATED_TOKEN: ${{ steps.organizer.outputs.updated_token }}
        run: echo "$UPDATED_TOKEN" | gh secret set GMAIL_TOKEN_JSON --repo "$GITHUB_REPOSITORY"
