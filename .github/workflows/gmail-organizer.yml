name: Gmail Organizer

on:
  schedule:
    # Runs every day at 8:00 AM Argentina time (UTC-3) = 11:00 UTC
    - cron: "0 11 * * *"
  workflow_dispatch:  # Allow manual trigger from GitHub UI

jobs:
  organize:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write config.json from secret
        env:
          GMAIL_ORGANIZER_CONFIG_JSON: ${{ secrets.GMAIL_ORGANIZER_CONFIG_JSON }}
        run: echo "$GMAIL_ORGANIZER_CONFIG_JSON" > config.json

      - name: Run Gmail Organizer
        id: organizer
        env:
          GMAIL_TOKEN_JSON: ${{ secrets.GMAIL_TOKEN_JSON }}
        run: python gmail_organizer.py

      # If the OAuth token was refreshed during the run, update the secret
      # so it doesn't expire on the next run.
      - name: Update token secret if refreshed
        if: steps.organizer.outputs.updated_token != ''
        uses: gliech/create-github-secret-action@v1
        with:
          name: GMAIL_TOKEN_JSON
          value: ${{ steps.organizer.outputs.updated_token }}
          token: ${{ secrets.GH_PAT }}
